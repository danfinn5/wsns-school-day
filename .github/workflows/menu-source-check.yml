name: Check public menu access
on:
  push:
    paths:
      - ".github/workflows/menu-source-check.yml"
      - "scripts/check-menu-source.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-menu-source.mjs
