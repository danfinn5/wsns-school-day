name: Check public menu access
on:
  push:
    paths:
      - ".github/workflows/menu-source-check.yml"
      - "scripts/check-menu-source.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-menu-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: menu-source-${{ matrix.runner }}
          path: menu-source-*.json
          retention-days: 3
